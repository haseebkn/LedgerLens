# Included at server level by nginx.conf and nginx.demo.conf. A location
# that sets its own add_header drops these, so keep add_header out of
# locations that serve the app.
#
# style-src needs 'unsafe-inline' for React style={...} attributes (the
# citation chip colours). No inline scripts are used.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Browsers ignore this over plain HTTP (the local demo); in AWS the ALB
# serves HTTPS only.
add_header Strict-Transport-Security "max-age=31536000" always;
