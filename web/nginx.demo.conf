# Local demo only (docker-compose.yml): stands in for the ALB, which in AWS
# routes /api/* to the agent and everything else to this container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://agent:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Server-sent events: pass each token through as it arrives.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }

    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
