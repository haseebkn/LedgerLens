# One-command demo on synthetic data:
#
#   ANTHROPIC_API_KEY=sk-ant-... docker compose up --build     (or: make demo)
#
# Then open http://localhost:8080. Needs only an Anthropic API key: no
# Plaid, Alpaca or Google credentials and no GPU. The warehouse and vector
# store are built from scripts/seed/ at image build time and baked into
# the images' `demo` targets, so nothing is mounted or loaded at runtime.
name: ledgerlens-demo

x-demo-build: &demo-build
  context: .
  target: demo
  additional_contexts:
    warehouse: service:warehouse

services:
  # Build-only: produces /out/financial_engine.db for the images below,
  # then exits.
  warehouse:
    build:
      context: .
      dockerfile: scripts/seed/Dockerfile
      args:
        SEED_END_DATE: ${SEED_END_DATE:-2026-11-30}
    image: ledgerlens-warehouse:demo
    command: ["true"]
    restart: "no"

  retrieval:
    build:
      <<: *demo-build
      dockerfile: vector_prep/Dockerfile
    image: ledgerlens-retrieval:demo
    environment:
      RETRIEVAL_SERVICE_TOKEN: demo-internal-token-not-a-secret
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  agent:
    build:
      <<: *demo-build
      dockerfile: agent/Dockerfile
    image: ledgerlens-agent:demo
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY to run the demo}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      RETRIEVAL_SERVICE_URL: http://retrieval:8100
      RETRIEVAL_SERVICE_TOKEN: demo-internal-token-not-a-secret
      RAW_DATA_ROOT: /repo/raw_data
    depends_on:
      retrieval:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: ledgerlens-web:demo
    volumes:
      - ./web/nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      agent:
        condition: service_healthy
