name: Deploy to AWS

# Every merge to main that passes CI deploys, by commit SHA. Images are
# immutable in ECR; each deploy renders a new task-definition revision from
# the current one (so Terraform's environment and secrets carry over),
# swaps in the SHA-tagged image, waits for the service to become stable,
# and runs the smoke test against the live URL. A deployment that can't
# stabilize is rolled back by the ECS circuit breaker (infra/aws/ecs.tf).
#
# Repository settings this needs:
#   secret   AWS_ROLE_ARN    OIDC-assumable role with ECR push, ECS
#                            register-task-definition/update-service/
#                            describe-*, and iam:PassRole on the task roles
#   variable DEPLOY_ENABLED  "true" once the AWS stack exists; until then,
#                            merges skip this workflow instead of failing
#   variable APP_URL         https://<domain_name>, for the smoke test
#   variable DATA_SOURCE     optional; must match Terraform's data_source
#                            ("baked_demo" by default, or "efs")
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deploy at a time, in order; never cancel one halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  PROJECT: financial-context
  ECS_CLUSTER: financial-context-cluster

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      DATA_SOURCE: ${{ vars.DATA_SOURCE || 'baked_demo' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images tagged with the commit SHA
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          if [ "$DATA_SOURCE" = "baked_demo" ]; then
            target=demo
            # The synthetic warehouse the demo targets bake in.
            docker build -f scripts/seed/Dockerfile -t ledgerlens-warehouse:"$IMAGE_TAG" .
            context=(--build-context "warehouse=docker-image://ledgerlens-warehouse:$IMAGE_TAG")
          else
            target=production
            context=()
          fi
          for svc in agent retrieval web; do
            case "$svc" in
              agent)     args=(-f agent/Dockerfile --target "$target" "${context[@]}") ;;
              retrieval) args=(-f vector_prep/Dockerfile --target "$target" "${context[@]}") ;;
              web)       args=(-f web/Dockerfile) ;;
            esac
            image="$REGISTRY/$PROJECT/$svc:$IMAGE_TAG"
            docker build "${args[@]}" -t "$image" .
            docker push "$image"
            echo "${svc^^}_IMAGE=$image" >> "$GITHUB_ENV"
          done

      - name: Download current task definitions
        run: |
          set -euo pipefail
          for svc in retrieval agent web; do
            aws ecs describe-task-definition --task-definition "$PROJECT-$svc" \
              --query taskDefinition > "task-$svc.json"
          done

      # Retrieval first (the agent's readiness depends on it), then the agent,
      # then the web frontend.
      - name: Render retrieval task definition
        id: render-retrieval
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-retrieval.json
          container-name: retrieval
          image: ${{ env.RETRIEVAL_IMAGE }}

      - name: Deploy retrieval
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-retrieval.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.PROJECT }}-retrieval
          wait-for-service-stability: true

      - name: Render agent task definition
        id: render-agent
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-agent.json
          container-name: agent
          image: ${{ env.AGENT_IMAGE }}

      - name: Deploy agent
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-agent.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.PROJECT }}-agent
          wait-for-service-stability: true

      - name: Render web task definition
        id: render-web
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-web.json
          container-name: web
          image: ${{ env.WEB_IMAGE }}

      - name: Deploy web
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-web.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.PROJECT }}-web
          wait-for-service-stability: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Health, readiness, a 401 without sign-in, demo sign-in, and one real
      # question that must stream text and carry a citation. This makes one
      # real model call per deploy.
      - name: Smoke test the live URL
        env:
          BASE_URL: ${{ vars.APP_URL }}
        run: node scripts/smoke/smoke.mjs
