name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, type-check, unit tests, dbt build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        # CI has no GPU, so install the CPU-only torch first; requirements.txt
        # no longer pins torch (the CUDA build lives in requirements-gpu.txt). chromadb and sentence-transformers still install
        # normally: tests/test_retrieval_service.py imports
        # vector_prep.retrieval_service, which imports both at module level
        # even though it only loads the real model inside its lifespan
        # handler, so they can't be skipped without breaking test collection.
        #
        # Tool versions come from requirements-dev.txt rather than a bare
        # `pip install ruff mypy` — unpinned linters mean a tool release can
        # fail the build with no change on our side, which is exactly how
        # ruff 0.16 first broke this workflow.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check extract/ load/ config/ tests/ vector_prep/

      - name: Ruff (format check)
        run: ruff format --check extract/ load/ config/ tests/ vector_prep/

      - name: mypy
        run: python -m mypy extract/ load/ config/ vector_prep/

      - name: pytest
        run: python -m pytest tests/ -v

      - name: dbt build against fixture data
        working-directory: transform
        env:
          RAW_DATA_ROOT: ../tests/fixtures/raw
        run: |
          dbt deps || true
          dbt build --full-refresh

      # --- Node workspaces (agent + web) ---
      # Runs after the dbt build above so financial_engine.db (fixture data)
      # already exists at the repo root — the agent's DuckDB-backed tool
      # tests (query_warehouse, get_portfolio_snapshot, summarize_spend) run
      # against it directly rather than against mocks.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      # Production and dev dependencies both; fails on high or critical.
      - name: npm audit
        run: npm audit --audit-level=high

      - name: Agent typecheck
        working-directory: agent
        run: npm run typecheck

      - name: Agent unit tests
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder-not-a-real-key
          DUCKDB_PATH: ../financial_engine.db
          RETRIEVAL_SERVICE_URL: http://127.0.0.1:8100
          RETRIEVAL_SERVICE_TOKEN: ci-placeholder-token
        run: npm test

      - name: Agent production build
        working-directory: agent
        run: npm run build

      - name: Lambda bundle packaging check (serverless deploy path)
        run: |
          node scripts/package-lambda.mjs \
            --warehouse financial_engine.db \
            --node-modules node_modules \
            --out /tmp/ci-lambda-bundle
          rm -rf /tmp/ci-lambda-bundle

      - name: Web typecheck
        working-directory: web
        run: npm run typecheck

      - name: Web lint
        working-directory: web
        run: npm run lint

      - name: Web unit tests
        working-directory: web
        run: npm test

      - name: Web production build
        working-directory: web
        run: npm run build

  # Real Postgres 16 + pgvector + Row-Level Security verification for Phase 3:
  # generates the 60-household synthetic advisor book, runs SQL migrations,
  # seeds under per-advisor RLS transactions, and verifies cross-tenant
  # isolation, view-only SQL tool permissions, append-only audit_log, and
  # hybrid pgvector + tsvector search.
  postgres-rls:
    name: Postgres + pgvector + RLS integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: ledgerlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ledgerlens"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate deterministic synthetic advisor book
        run: python scripts/seed/generate_advisor_book.py --out .demo/advisor_book/book.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run Postgres + pgvector + RLS integration tests
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder-not-a-real-key
          RETRIEVAL_MODE: local
          DATABASE_URL: postgres://postgres:ci_postgres_password@127.0.0.1:5432/ledgerlens
          DB_APP_ROLE: ledgerlens_app
          DB_RO_ROLE: ledgerlens_ro
          ADVISOR_BOOK_PATH: ../.demo/advisor_book/book.json
        run: npx vitest run src/db/rls.integration.test.ts

  # Builds and runs the images that ship (the compose demo stack, with the
  # seed warehouse baked in) against a fake Anthropic API, then checks what a
  # user would hit: health, readiness, a streamed and cited answer through the
  # nginx proxy, the Evals report, and the security headers. Unit tests can't
  # see a broken health check, a missing file in an image or a buffering
  # proxy; this job can.
  containers:
    name: Container smoke test (compose stack, fake model)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: sk-ant-fake-ci-not-a-real-key
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml

    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: $COMPOSE build

      - name: Start the stack and wait for health checks
        run: $COMPOSE up -d --wait --wait-timeout 300 web

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke test through the web proxy
        env:
          BASE_URL: http://localhost:8080
          EXPECT_STREAMING_GAP_MS: "300"
        run: node scripts/smoke/smoke.mjs

      - name: Evals report is in the agent image
        run: curl -fsS http://localhost:8080/api/evals/latest | head -c 300

      - name: Security headers are served
        run: |
          headers=$(curl -fsSI http://localhost:8080/)
          echo "$headers"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'

      - name: Service logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: $COMPOSE down --volumes

  dag-integrity:
    name: Airflow DAG integrity (DagBag import check)
    runs-on: ubuntu-latest

    # Was `astro dev parse`, which builds the Astro image and runs a
    # container to import the DAGs. That pulled the Astro CLI unpinned, and
    # a newer CLI against the pinned astro-runtime:11.3.0 image failed with
    # "unable to find user airflow" before it ever reached the DAGs.
    #
    # The DAGs only import core Airflow at module level (boto3 and
    # airflow.models.Variable are imported inside task functions), so a
    # plain DagBag import check validates exactly the same thing without
    # Docker — faster, and with no CLI/image version coupling. The test
    # itself is the one Astro scaffolds at orchestration/tests/dags/.
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/orchestration

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Airflow
        # Pinned to the Airflow version behind astro-runtime 11.3.0, with
        # Airflow's own constraints file — an unconstrained Airflow install
        # resolves incompatible transitive deps.
        run: |
          pip install "apache-airflow==2.9.3" pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-3.11.txt"

      - name: DAG integrity tests
        working-directory: orchestration
        run: python -m pytest tests/dags -v

  terraform:
    name: Terraform validate (infra/aws)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Format check
        working-directory: infra/aws
        run: terraform fmt -check -recursive

      - name: Init (no backend, no credentials needed for validate)
        working-directory: infra/aws
        run: terraform init -backend=false

      - name: Validate
        working-directory: infra/aws
        run: terraform validate
